{
  "schema_version": "extension_descriptor_v1",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "extension_id": "flowsteward.redis",
  "release_version": "1.1.5",
  "extension_type": "service_extension",
  "identity": {
    "display_name": "Redis",
    "description": "Use Redis for workflow state, duplicate-event checks, counters and lightweight list processing. The extension reads and writes text keys or whole JSON values, checks existence and expiry, deletes keys, sets TTLs and increments counters. Hash actions read, write or delete fields; list actions push, pop, read a range or return the list length. Conditional SET supports create-only or update-only writes with an optional expiry, and returns whether the change applied.\n\nRead-only Datasets expose explicit-key string, hash, list and JSON views through saved definitions, typed parameters, validation, previews and schema inference. JSON lives in ordinary string keys, so RedisJSON is not required. Normal database connections use existing keys with an optional allowed prefix; legacy project-state connections retain their scoped key names.\n\nFor example, claim an event key with create-only SET and a TTL, continue only when applied is true, or push right and pop left for a basic FIFO list. Expiry does not guarantee exactly-once processing, and a popped item is removed immediately without acknowledgements or crash recovery. Connections target one standalone endpoint; cluster discovery, Sentinel, scans, arbitrary commands and blocking queue operations are unavailable.",
    "tags": [
      "redis",
      "toolbox"
    ]
  },
  "vendor": {
    "vendor_name": "Flow Steward"
  },
  "listing": {
    "visibility": "public_reference",
    "category": "data"
  },
  "distribution": {
    "channel": "private_byo",
    "execution_modes": [
      "local"
    ],
    "allows_self_hosted": true,
    "requires_connected_control_plane": false,
    "import_sources": [
      "file"
    ]
  },
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.5.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml",
      "dataset_connectors": [
        {
          "connector_id": "redis",
          "connector_type_id": "redis_database",
          "database_kind": "redis",
          "display_name": "Redis",
          "description": "Bounded explicit-key string, hash, list and ordinary JSON views. No scans or arbitrary commands.",
          "source_kind": "redis",
          "source_extension_id": "flowsteward.redis",
          "source_extension_name": "Redis",
          "source_provider": "Redis",
          "query_language": "json",
          "access_mode": "read_only",
          "runtime_kind": "local_extension",
          "runtime_adapter_ref": "main.py",
          "connector_catalog": [
            {
              "source_kind": "redis",
              "connector_type_id": "redis_database",
              "display_name": "Redis",
              "query_language": "json",
              "preset_config": {}
            }
          ],
          "connection_schema": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "host"
            ],
            "properties": {
              "host": {
                "type": "string",
                "title": "Server hostname or IP address",
                "minLength": 1,
                "maxLength": 253
              },
              "port": {
                "type": "integer",
                "title": "Port",
                "minimum": 1,
                "maximum": 65535,
                "default": 6379
              },
              "database": {
                "type": "integer",
                "title": "Database number",
                "minimum": 0,
                "maximum": 15,
                "default": 0
              },
              "tls": {
                "type": "boolean",
                "title": "Use TLS with certificate verification",
                "default": true
              },
              "request_timeout_seconds": {
                "type": "integer",
                "title": "Request timeout seconds",
                "minimum": 1,
                "maximum": 30,
                "default": 15
              },
              "key_prefix": {
                "type": "string",
                "title": "Allowed key prefix (optional)",
                "maxLength": 256,
                "default": ""
              }
            }
          },
          "secret_schema": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "username": {
                "type": "string",
                "title": "ACL username (optional)"
              },
              "password": {
                "type": "string",
                "title": "Password (optional)"
              }
            }
          },
          "capabilities": {
            "read_only": true,
            "test_connection": true,
            "schema_introspection": true,
            "validate_query": true,
            "preview_query": true,
            "execute_template": true,
            "infer_output_schema": true,
            "write_queries": false,
            "row_preview": true
          },
          "safety_profile": {
            "access_mode": "read_only",
            "indexes_rows": false,
            "executes_write_queries": false,
            "requires_saved_template": true
          },
          "preview_support": true,
          "schema_refresh_support": true
        }
      ],
      "resource_query_manifest": [
        {
          "query_id": "runtime_health",
          "cursor_mode": "none",
          "description": "Redis runtime health.",
          "required_scopes": [
            "extension:invoke"
          ],
          "result_fields": [
            "result.status",
            "result.extension_id"
          ],
          "error_codes": [
            "invalid_payload"
          ]
        },
        {
          "query_id": "supported_connectors",
          "cursor_mode": "none",
          "description": "Redis supported connectors.",
          "required_scopes": [
            "extension:invoke"
          ],
          "result_fields": [
            "result.connectors"
          ],
          "error_codes": [
            "invalid_payload"
          ]
        }
      ]
    }
  }
}
